        const added=!e.data.control&&!existing.has(e.data.semantic),stroke=added?'#f1c40f':e.style?.stroke;
        return {...e,id:'proposal:'+e.id,source:ids.has(e.source)?'ghost:'+e.source:e.source,target:ids.has(e.target)?'ghost:'+e.target:e.target,selected:false,selectable:false,reconnectable:false,focusable:false,style:{...e.style,...(added?{stroke,strokeWidth:2.5,strokeDasharray:'6 4'}:{})},markerEnd:added&&typeof e.markerEnd==='object'?{...e.markerEnd,color:stroke}:e.markerEnd,data:{...e.data,canReconnect:false}};
      });
      return {nodes:[...proposed,...nodes.filter(n=>ids.has(n.id)).map(n=>({...n,style:{...n.style,opacity:0},data:{...n.data,multiple:false}}))],edges};
    },[insertion,projection.nodes,layout,nodes,onToggle]);
    const dragStart=(_,node)=>{drag.current={id:node.id,start:{...node.position},state:M.copy(stateRef.current),layout,candidateKey:null,preview:null,cancelled:false};};
    const dragMove=(_,node)=>{
      const frame=drag.current;if(!frame||frame.cancelled)return;
      const c=M.componentFor(frame.state,node.id),dx=node.position.x-frame.start.x,dy=node.position.y-frame.start.y;
      setDragOffset({ids:c.ids,dx,dy});
      const candidate=AppCanvas.findInsertion(frame.state,frame.layout,node.id,{x:node.position.x+node.measured.width/2,y:node.position.y+node.measured.height/2},flow.getZoom());
      const key=candidate&&JSON.stringify([candidate.sourceId,candidate.targetId,candidate.mode,candidate.side]);
      if(key===frame.candidateKey)return;frame.candidateKey=key;
      try{frame.preview=candidate?{...AppCanvas.previewInsertion(frame.state,node.id,candidate),candidate}:null;}catch{frame.preview=null;}
      setInsertion(frame.preview);
    };
    const dragStop=(_,node)=>{
      const frame=drag.current;if(!frame)return;drag.current=null;setDragOffset(null);setInsertion(null);
      if(frame.cancelled)return;
      if(frame.preview){mutate(d=>M.insertStructure(d,node.id,frame.preview.candidate));selectItem(frame.preview.entryId);}
      else mutate(d=>M.moveComponent(d,node.id,node.position.x-frame.start.x,node.position.y-frame.start.y));
    };
    const requestConnectionLevel=useCallback(connection=>{
      const context=M.loopConnectionContext(stateRef.current,connection.source,connection.target,connection.previous);if(!context)return false;
      setModal({type:'branch-level',parentId:connection.source,connection,levels:context.levels});return true;
    },[]);
    const submitLoopOperation=useCallback((request,scopeId,mode)=>{
      if(!request.connection){submitAdd(request.parentId,mode,scopeId);return;}
      const connection=request.connection;let edge;
      const changed=mutate(d=>{edge=M.connectAtLoopLevel(d,connection.source,connection.target,scopeId,connection.previous,mode);});
      if(changed){setModal(null);if(connection.previous)selectEdge(edge);else selectItem(connection.source);notify('Conexión configurada en el nivel elegido.');}
    },[mutate,notify,selectItem,selectEdge,submitAdd]);
    const connect=useCallback(c=>{
      const normalized=M.normalizeConnection(stateRef.current,c.source,c.sourceHandle==='flow-source'?'bottom':'top',c.target,c.targetHandle==='flow-source'?'bottom':'top');
      if(!normalized){notify('Conecta inferior → superior entre trials reales.');return;}
      if(requestConnectionLevel(normalized))return;
      if(mutate(d=>M.connect(d,normalized.source,normalized.target))){selectItem(normalized.source);notify(M.realTrial(stateRef.current,normalized.source).defaultNextTrialId===normalized.target?'Default configurado en el padre.':'Then go to creado en el padre.');}
    },[mutate,notify,requestConnectionLevel,selectItem]);
    const reconnect=useCallback((edge,connection)=>{
      const previous=M.connections(stateRef.current).find(e=>e.id===edge.data.semantic);
      if(!previous||connection.sourceHandle!=='flow-source'||connection.targetHandle!=='flow-target'||!M.realTrial(stateRef.current,connection.source)||!M.realTrial(stateRef.current,connection.target)){notify('Conecta el origen al conector inferior y el destino al superior de un trial.');return;}
      const sourceChanged=connection.source!==previous.source,targetChanged=connection.target!==previous.target;
      if(sourceChanged===targetChanged)return;
      if(requestConnectionLevel({source:connection.source,target:connection.target,previous:{source:previous.source,target:previous.target}}))return;
      let selected=null;
      const changed=mutate(d=>{selected=sourceChanged?M.reconnectSource(d,previous.source,previous.target,connection.source):M.reconnectTarget(d,previous.source,previous.target,connection.target);});
      if(changed&&selected){selectEdge(selected);notify(sourceChanged?'Padre de la conexión actualizado.':'Destino de la conexión actualizado.');}
    },[mutate,notify,selectEdge,requestConnectionLevel]);
    const addLoose=()=>{const bounds=document.querySelector('.canvas-area').getBoundingClientRect(),point=flow.screenToFlowPosition({x:bounds.left+bounds.width*.64,y:bounds.top+bounds.height*.45});let id;mutate(d=>{id=M.addTrial(d,point);});selectItem(id);notify('Trial guardado en el editor, sin conexión.');};
    const createLoop=()=>{
      const ids=multiple?multipleIds:selectedId?[selectedId]:[];
      if(!ids.length){notify('Selecciona trials o loops en el canvas para crear un loop.');return;}
      let id;const changed=mutate(d=>{id=M.groupLoop(d,ids,'Loop '+(d.loops.length+1));});
      if(changed)selectItem(id);
    };
    const undo=useCallback(()=>{if(!history.current.length)return;future.current.push(M.copy(stateRef.current));const previous=history.current.pop();stateRef.current=previous;setState(previous);},[]);
    const redo=useCallback(()=>{if(!future.current.length)return;history.current.push(M.copy(stateRef.current));const next=future.current.pop();stateRef.current=next;setState(next);},[]);
    const deleteSelection=useCallback(()=>{
      if(!selection)return false;
      if(selection.type==='items'){
        const changed=mutate(d=>M.deleteItems(d,selection.ids));if(changed)clearSelection();return changed;
      }
      const edge=M.connections(stateRef.current).find(e=>e.id===edgeId),selected=M.item(stateRef.current,selectedId);
      if(!edge&&!selected)return false;
      const changed=mutate(d=>edge?M.removeConnection(d,edge.source,edge.target):M.realTrial(d,selectedId)?M.deleteTrial(d,selectedId):M.deleteLoop(d,selectedId));
      if(changed){clearSelection();}
      return changed;
    },[selection,selectedId,edgeId,mutate,clearSelection]);
    useEffect(()=>{
      const onKeyDown=event=>{
        if(event.key==='Escape'&&drag.current){event.preventDefault();drag.current.cancelled=true;drag.current.preview=null;setDragOffset(null);setInsertion(null);return;}
        if(event.defaultPrevented||event.isComposing||event.altKey||modal||tab==='open-branch'||drag.current||connectionGesture.current||rectangle.current?.active)return;
        if(event.composedPath().some(el=>el?.isContentEditable||el?.matches?.('input:not([type="checkbox"]):not([type="radio"]),textarea,select,[role="textbox"]')))return;
        const key=event.key.toLowerCase(),command=event.ctrlKey||event.metaKey;
        if(command&&key==='z'){event.preventDefault();event.shiftKey?redo():undo();}
        else if(event.ctrlKey&&!event.metaKey&&key==='y'){event.preventDefault();redo();}
        else if(!command&&!event.repeat&&(key==='delete'||key==='backspace')){if(deleteSelection())event.preventDefault();}
      };
      window.addEventListener('keydown',onKeyDown);
      return()=>window.removeEventListener('keydown',onKeyDown);
    },[modal,tab,deleteSelection,undo,redo]);
    const live=M.reachable(s),islands=layout.groups.filter(c=>!c.locked);
    useEffect(()=>{if(tab==='open-branch'){setModal({type:'branch'});setTab('branch');}},[tab]);
    useEffect(()=>{window.workspaceDemo={getState:()=>M.copy(stateRef.current),load:value=>{setModal(null);setTab('branch');clearSelection();mutate(()=>M.copy(value));},model:M,generatedHTML:()=>generatedHTML(stateRef.current),defaultDependencies:{getTrial:async id=>M.realTrial(stateRef.current,String(id)),updateTrial:async(id,updates)=>mutate(d=>M.setDefault(d,String(id),updates.defaultNextTrialId)),updateLoop:async()=>{throw Error('Loops are not branch sources');}}};return()=>delete window.workspaceDemo;},[mutate]);
    return html`<div style=${{display:'contents'}}><header className="header"><span className="brand">ExpBuilder</span><h1>Laboratorio de conexiones</h1><select aria-label="Escenario" value=${preset} onChange=${e=>{const value=e.target.value;setPreset(value);setModal(null);setTab('branch');clearSelection();mutate(()=>M.copy(presets[Number(value)]));}}>${presets.map((p,i)=>html`<option key=${i} value=${String(i)}>${p.name}</option>`)}</select><span className="grow"></span><button title="Deshacer" onClick=${undo} disabled=${!history.current.length}>↶</button><button title="Rehacer" onClick=${redo} disabled=${!future.current.length}>↷</button><button onClick=${()=>setModal({type:'questions'})}>Decisiones por resolver</button><button className="gold" onClick=${()=>setModal({type:'inspect'})}>Estado / HTML</button></header>
      <div className="workspace"><main className="canvas-area" tabIndex=${-1} style=${AppCanvas.getCanvasBackground(true)}><div style=${AppCanvas.getPatternStyle(true)}></div>
        <${Flow} onPointerDownCapture=${prepareRectangle} onPointerMove=${updateRectangle} onSelectionStart=${startRectangle} onSelectionEnd=${endRectangle} selectionOnDrag=${true} selectionMode="partial" paneClickDistance=${4} selectionKeyCode=${null} nodes=${insertionView?.nodes??nodes} edges=${insertionView?.edges??visibleEdges} nodeTypes=${nodeTypes} edgeTypes=${edgeTypes} connectionMode=${ConnectionMode.Loose} onConnect=${connect} isValidConnection=${c=>!!M.normalizeConnection(stateRef.current,c.source,c.sourceHandle==='flow-source'?'bottom':'top',c.target,c.targetHandle==='flow-source'?'bottom':'top')} connectionRadius=${24} onConnectStart=${()=>{connectionGesture.current=true;}} onConnectEnd=${()=>{requestAnimationFrame(()=>{connectionGesture.current=false;});}} nodesConnectable=${true} nodesDraggable=${true} edgesReconnectable=${true} onReconnect=${reconnect} onReconnectStart=${()=>{connectionGesture.current=true;}} onReconnectEnd=${()=>{requestAnimationFrame(()=>{connectionGesture.current=false;});}} reconnectRadius=${reconnectRadius} minZoom=${.15} maxZoom=${2} deleteKeyCode=${null} onNodeClick=${(event,n)=>{if(n.type==='loopBox'||n.data.ghost||event.target.closest('input,button,.react-flow__handle'))return;if(multiple)checkItem(n.id);else selectItem(n.id);}} onNodeDoubleClick=${(event,n)=>{if(n.type==='loopBox'||event.target.closest('input,button,.react-flow__handle'))return;selectMultiple(n.id);}} onEdgeClick=${(_,e)=>{if(e.data.control)return;const semantic=M.connections(stateRef.current).find(edge=>edge.id===e.data.semantic);if(semantic){selectEdge(semantic.id);}}} onPaneClick=${()=>{if(connectionGesture.current)return;clearSelection();}} onNodeDragStart=${dragStart} onNodeDrag=${dragMove} onNodeDragStop=${dragStop} panOnDrag=${[1]} panOnScroll=${true} zoomOnDoubleClick=${false} zoomOnPinch=${true} zoomOnScroll=${false} style=${{background:'transparent'}} proOptions=${{hideAttribution:true}}>
          <${AppCanvas.CanvasViewportFitter} layoutSignature=${topology} bounds=${fitBounds}/>
        <//>
        <${AppCanvas.CanvasToolbar} fabStyle=${AppCanvas.getFabStyle(true)} scopeKind="root" itemCount=${s.trials.length+s.loops.length} hasSelection=${!!M.realTrial(s,selectedId)} onCreateLoop=${createLoop} onAddTrial=${addLoose} onShowBranches=${()=>setModal({type:'branch'})}/>
        ${toast?html`<div className="toast" role="status">${toast}</div>`:null}
        ${insertion?html`<div className="insertion-preview" data-testid="insertion-preview" data-source=${insertion.sourceId} data-mode=${insertion.mode} data-entry=${insertion.entryId} data-exit=${insertion.exitId} role="status"><strong>${insertion.mode==='sequential'?'Insertar en secuencial':'Insertar en paralelo'}</strong>${insertion.mode==='parallel'?`${M.item(s,insertion.sourceId).name} → ${insertion.siblingIds.map(id=>M.item(s,id).name).join(' / ')}`:`${M.item(s,insertion.sourceId).name} → ${M.item(s,insertion.entryId).name} · ${M.item(s,insertion.exitId).name} → ${M.item(s,insertion.targetId).name}`}<br/>Soltar para insertar · Esc para cancelar</div>`:null}
        <div className="canvas-hint">Clic izquierdo y arrastrar: selección rectangular · Dos dedos: mover canvas · Doble clic: checkboxes · Arrastra grupos desconectados · Inferior → superior conecta trials · Selecciona una conexión para cambiar su origen o destino, o eliminarla · Los loops no son destinos</div>
      </main><${Sidebar} s=${s} selectedId=${selectedId} selectItem=${selectItem} edgeId=${edgeId} mutate=${mutate} tab=${tab} setTab=${setTab} onDeleteSelection=${deleteSelection} multipleIds=${multipleIds}/></div>
      <footer className="statusbar"><span>Solo memoria · sin DB ni API</span><span>${s.trials.length} trials guardados / ${live.trials.size} en HTML</span><span>${s.loops.length} loops / ${live.loops.size} en HTML</span><span>${islands.length} grupos libres</span></footer>
      ${modal?.type==='branch-level'?html`<div className="overlay branch-level-modal" style=${{zIndex:9999}}><${AppCanvas.LoopBranchLevelModal} sourceName=${M.item(s,modal.parentId)?.name} levels=${modal.levels??M.loopBranchLevels(s,modal.parentId)} onClose=${()=>setModal(null)} onConfirm=${scopeId=>{
        const selection=M.loopBranchSelection(stateRef.current,{sourceId:modal.parentId,targetId:modal.connection?.target,previous:modal.connection?.previous},scopeId);if(!selection)return;
        if(selection.requiresPlacement)setModal({type:'add',parentId:modal.parentId,scopeId,connection:modal.connection});else submitLoopOperation(modal,scopeId,'parallel');
      }}/></div>`:null}
      ${modal?.type==='add'?html`<div className="overlay" style=${{zIndex:9999}}><${AppCanvas.AddTrialModal} parentName=${M.item(s,modal.parentId)?.name} existingTrialName=${modal.connection?M.item(s,modal.connection.target)?.name:undefined} onClose=${()=>setModal(null)} onConfirm=${parallel=>submitLoopOperation(modal,modal.scopeId,parallel?'parallel':'sequential')}/></div>`:null}
      ${modal?.type==='branch'&&M.realTrial(s,selectedId)?html`<${BranchDialog} s=${s} t=${M.realTrial(s,selectedId)} mutate=${mutate} onClose=${()=>setModal(null)}/>`:null}
      ${modal?.type==='inspect'?html`<${Inspector} s=${s} mutate=${mutate} onClose=${()=>setModal(null)}/>`:null}
      ${modal?.type==='questions'?html`<${Modal} title="Decisiones por resolver" onClose=${()=>setModal(null)}><p className="muted small">Estas decisiones de producto están expuestas en el prototipo; no cambian la aplicación real.</p><ul className="notice-list"><li><strong>Inicio:</strong> hay un único inicio. Incorporar una estructura por delante del inicio actual promueve su cabecera. Los retornos conservan el inicio mientras el ciclo permanezca conectado. Al borrar el inicio se sigue su Default, saltando los trials eliminados; si no sobrevive ninguna continuación, se toma una cabecera de las estructuras restantes según su orden guardado. Solo un canvas sin trials queda sin inicio.</li><li><strong>Nuevas conexiones:</strong> la primera salida configura Default; las adicionales crean Then go to. El Default siempre apunta a un destino conectado. Falta definir cuándo exigir la condición IF de los Then go to antes de generar el experimento real.</li><li><strong>Convergencias:</strong> los trials no alcanzables siguen movibles aunque apunten a la secuencia principal. Sus conexiones se adaptan y no se exportan hasta integrarse.</li><li><strong>Cambio de ámbito:</strong> al unir los conectores de un trial de un loop y una estructura suelta se elige el nivel antes de aplicar la conexión. Los loops internos se conservan. Desconectar una subestructura interna que pierde acceso desde la entrada la devuelve al canvas principal.</li><li><strong>Loops:</strong> al quedarse sin trials se eliminan automáticamente, incluidos los loops exteriores que también queden vacíos.</li><li><strong>Ciclos:</strong> se permiten. Hay que definir advertencias por rutas sin salida, sin convertirlas automáticamente en loops.</li></ul><//>`:null}
    </div>`;
  }
  ReactDOM.createRoot(document.getElementById('app')).render(html`<${ReactFlowProvider}><${App}/><//>`);
})();
</script>
