name: Public session persistence

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'api/**'
      - 'client/src/pages/ExperimentBuilder/**'
      - 'client/src/lib/publicSettings.ts'
      - 'client/runtime-e2e/authoring/**'
      - 'client/package*.json'
      - 'server/dynamicplugin/**'
      - 'server/jspsych-bundler/**'
      - 'server/jspsych-bundle/**'
      - 'shared/**'
      - 'scripts/*persistence*'
      - 'package*.json'
      - 'benchmarks/**'
      - '.github/workflows/public-persistence.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'client/src/pages/ExperimentBuilder/**'
      - 'client/src/lib/publicSettings.ts'
      - 'client/runtime-e2e/authoring/**'
      - 'client/package*.json'
      - 'server/dynamicplugin/**'
      - 'server/jspsych-bundler/**'
      - 'server/jspsych-bundle/**'
      - 'shared/**'
      - 'scripts/*persistence*'
      - 'package*.json'
      - 'benchmarks/**'
      - '.github/workflows/public-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      persistence: ${{ steps.select.outputs.persistence }}
      benchmark: ${{ steps.select.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.22.2 <23"
      - id: select
        run: node benchmarks/ci/select.mjs

  persistence:
    needs: changes
    if: needs.changes.outputs.persistence == 'true' || needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.22.2 <23"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            api/functions/package-lock.json
            server/jspsych-bundler/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/firebase/emulators
            ${{ runner.temp }}/firebase-sdk-9.23.0
          key: persistence-emulators-firebase-sdk-9.23.0-${{ runner.os }}
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix api/functions
      - run: npm ci --prefix server/jspsych-bundler
      - run: npm run build --prefix server/jspsych-bundler
      - run: npx --prefix client playwright install --with-deps chromium
      - run: npm run test:e2e:persistence
        if: needs.changes.outputs.persistence == 'true'
        env:
          PERSISTENCE_SDK_DIR: ${{ runner.temp }}/firebase-sdk-9.23.0
      - name: Measure and compare costs
        if: ${{ !cancelled() && needs.changes.outputs.benchmark == 'true' }}
        run: npm run benchmark:cost:check -- --output "$COST_CHECK_OUTPUT" --policy benchmarks/policies/persistence-temporal-storage.json --normalization benchmarks/ci/normalization.json
        env:
          COST_CHECK_OUTPUT: ${{ runner.temp }}/cost-check
          PERSISTENCE_SDK_DIR: ${{ runner.temp }}/firebase-sdk-9.23.0
      - name: Verify benchmark report exists
        if: ${{ always() && needs.changes.outputs.benchmark == 'true' }}
        run: node benchmarks/ci/ensure-report.mjs "${{ runner.temp }}/cost-check"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && needs.changes.outputs.benchmark == 'true' }}
        with:
          name: cost-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cost-check
          if-no-files-found: error
          retention-days: 7
